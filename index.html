<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CashFlowOS — Revenue Operations</title></head>
<body>
<div id="app"></div>
<script>
const API='https://cashflowos-api.onrender.com';
const ORG='00000000-0000-0000-0000-000000000001';
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','x-organization-id':ORG,...(options.headers||{})}});if(!r.ok)throw new Error('API '+r.status);return r.json()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 document.getElementById('app').innerHTML='<main style="font-family:Inter,system-ui;max-width:1200px;margin:40px auto;padding:20px"><h1>CashFlowOS</h1><p>Loading live revenue operations data…</p></main>';
 try{await api('/api/bootstrap',{method:'POST'});const [o,c,q,p]=await Promise.all([api('/api/overview'),api('/api/customers'),api('/api/collection/queue'),api('/api/promises')]);
 document.getElementById('app').innerHTML=`<style>body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,system-ui}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.brand b{color:#2563eb}.sub{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card{background:white;border:1px solid #e6eaf0;border-radius:14px;padding:18px}.label{font-size:11px;text-transform:uppercase;color:#667085;font-weight:800}.value{font-size:25px;font-weight:900;margin-top:8px}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:15px;margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #eef1f5;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:#667085}.pill{border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.high{background:#fff0ee;color:#b42318}.medium{background:#fff7e6;color:#a15c00}.low{background:#ecfdf3;color:#087443}.queue{display:grid;gap:9px}.q{padding:12px;border:1px solid #e6eaf0;border-radius:10px}.q strong{font-size:12px}.q p{font-size:11px;color:#667085;margin:5px 0}.btn{border:0;border-radius:8px;padding:8px 11px;background:#2563eb;color:white;font-weight:750;cursor:pointer}.muted{color:#667085}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}
</style><div class="wrap"><div class="top"><div><div class="brand">CashFlow<b>OS</b></div><div class="sub">Revenue operations · Live workspace</div></div><button class="btn" onclick="load()">Refresh</button></div>
<div class="grid"><div class="card"><div class="label">Outstanding</div><div class="value">${money(o.outstanding)}</div></div><div class="card"><div class="label">Overdue</div><div class="value">${money(o.overdue)}</div></div><div class="card"><div class="label">Promises today</div><div class="value">${money(o.promisesDueToday)}</div></div><div class="card"><div class="label">Orders waiting</div><div class="value">${o.ordersWaiting}</div></div><div class="card"><div class="label">Credit risk</div><div class="value">${o.highRisk}</div></div></div>
<div class="layout"><section class="card"><div class="head"><h2>Customers & receivables</h2><span class="muted">${c.length} customers</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Customer</th><th>Outstanding</th><th>Overdue</th><th>Risk</th></tr></thead><tbody>${c.slice(0,20).map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.phone||x.email||'')}</div></td><td>${money(x.outstanding)}</td><td>${x.max_days_overdue||0} days</td><td><span class="pill ${x.risk}">${esc(x.risk)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No customers yet.</td></tr>'}</tbody></table></div></section>
<section class="card"><div class="head"><h2>AI collection queue</h2><span class="muted">Top opportunities</span></div><div class="queue">${q.slice(0,8).map(x=>`<div class="q"><strong>${esc(x.name)}</strong><p>${money(x.outstanding)} · ${x.max_days_overdue||0} days overdue</p><span class="pill ${x.priority}">${esc(x.priority)}</span> <button class="btn" onclick="draft(${JSON.stringify(x.name)},${Number(x.outstanding)},'')">Draft WhatsApp</button></div>`).join('')||'<div class="muted">No collection actions yet.</div>'}</div></section></div></div>`;
 }catch(e){document.getElementById('app').innerHTML='<main style="font-family:system-ui;max-width:800px;margin:60px auto;padding:20px"><h1>CashFlowOS</h1><p>Unable to load the live workspace.</p><button onclick="load()">Retry</button></main>';console.error(e)}}
async function draft(name,amount,invoice){try{const d=await api('/api/collection/drafts',{method:'POST',body:JSON.stringify({customer_name:name,amount,invoice_id:invoice})});alert(d.message)}catch(e){alert('Could not generate draft')}}
load();
</script></body></html>
