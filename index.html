<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CashFlowOS — Revenue Operations</title></head>
<body><div id="app"></div><script>
const API='https://cashflowos-api.onrender.com',ORG='00000000-0000-0000-0000-000000000001';
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={},timeout=12000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API+path,{...options,signal:ctl.signal,headers:{'Content-Type':'application/json','x-organization-id':ORG,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`API ${r.status}`);return d}finally{clearTimeout(timer)}}
function shell(body){document.getElementById('app').innerHTML=`<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#111827;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.wrap{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:25px;font-weight:900;letter-spacing:-.04em}.brand b{color:#2563eb}.sub{color:#667085;font-size:13px;margin-top:3px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.btn.secondary{background:white;color:#344054;border:1px solid #d0d5dd}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 1px 2px #00000008}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:800}.value{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:8px}.layout{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.head h2{font-size:15px;margin:0}.muted{color:#667085}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #eef1f5;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:#667085}.pill{border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;text-transform:capitalize}.high{background:#fff0ee;color:#b42318}.medium{background:#fff7e6;color:#a15c00}.low{background:#ecfdf3;color:#087443}.queue{display:grid;gap:9px}.q{padding:13px;border:1px solid #e6eaf0;border-radius:11px}.q strong{font-size:12px}.q p{font-size:11px;color:#667085;margin:5px 0 8px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.import{margin:14px 0}.importbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border:1px dashed #cbd5e1;border-radius:11px;background:#f8fafc}.file{max-width:100%;font-size:12px}.hint{font-size:11px;color:#667085;margin-top:9px}.progress{margin-top:10px;height:7px;background:#e9edf2;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:#2563eb;width:0;transition:width .2s}.notice{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:12px;background:#eff6ff;color:#1d4ed8}.error{margin:30px auto;max-width:650px;background:white;border:1px solid #fecdca;border-radius:14px;padding:22px}.error h2{margin:0 0 8px}.status{font-size:11px;color:#087443;font-weight:800}.skeleton{height:130px;border-radius:14px;background:#eef1f5;margin:20px 0}.footer{margin-top:18px;font-size:11px;color:#98a2b3}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.top{align-items:flex-start}.table{min-width:560px}.toolbar{width:100%}}
</style><div class="wrap">${body}</div>`}
function loading(){shell(`<div class="top"><div><div class="brand">CashFlow<b>OS</b></div><div class="sub">Revenue operations · Live workspace</div></div></div><div class="skeleton"></div><p class="muted">Connecting to your live workspace…</p>`)}
function errorView(e){const msg=e?.name==='AbortError'?'The API took too long to respond.':(e?.message||'Unable to load the live workspace.');shell(`<div class="top"><div><div class="brand">CashFlow<b>OS</b></div><div class="sub">Revenue operations · Connection status</div></div><button class="btn" onclick="load()">Retry</button></div><div class="error"><div class="status">● LIVE APP</div><h2>We couldn't load your workspace</h2><p class="muted">${esc(msg)}</p><p class="muted">The page is responsive and the API connection will retry when you tap Retry.</p></div>`)}
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quoted&&next==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}if(cell||row.length){row.push(cell.trim());if(row.some(Boolean))rows.push(row)}if(rows.length<2)throw Error('CSV must contain a header row and at least one data row.');const headers=rows[0].map(x=>x.toLowerCase().replace(/\s+/g,'_'));const required=['customer_name','invoice_id','due_date','invoice_amount','paid_amount'];const missing=required.filter(x=>!headers.includes(x));if(missing.length)throw Error(`Missing columns: ${missing.join(', ')}`);return rows.slice(1).map((r,i)=>{const o={};headers.forEach((h,j)=>o[h]=(r[j]??'').trim());o._row=i+2;return o}).filter(r=>Object.values(r).some(v=>v!==''&&v!==r._row))}
async function importCsv(input){const file=input.files?.[0];if(!file)return;const btn=document.getElementById('importBtn'),msg=document.getElementById('importMsg'),bar=document.getElementById('importBar');btn.disabled=true;msg.textContent='Reading CSV…';bar.style.width='0%';try{const rows=parseCsv(await file.text());if(rows.length>500)throw Error('Import is limited to 500 rows per upload.');const customers=await api('/api/customers');const byName=new Map(customers.map(c=>[String(c.name).trim().toLowerCase(),c]));let createdCustomers=0,createdInvoices=0,createdPayments=0,failed=0;for(let i=0;i<rows.length;i++){const r=rows[i];try{const amount=Number(r.invoice_amount),paid=Number(r.paid_amount||0);if(!r.customer_name||!r.invoice_id||!r.due_date||!Number.isFinite(amount)||amount<0)throw Error(`Invalid customer/invoice/amount on row ${r._row}`);if(!Number.isFinite(paid)||paid<0||paid>amount)throw Error(`Invalid paid_amount on row ${r._row}`);let customer=byName.get(r.customer_name.toLowerCase());if(!customer){customer=await api('/api/customers',{method:'POST',body:JSON.stringify({name:r.customer_name,phone:r.phone||null,email:r.email||null,credit_limit:Number(r.credit_limit||0),external_id:r.customer_id||null})});byName.set(r.customer_name.toLowerCase(),customer);createdCustomers++}const invoice=await api('/api/invoices',{method:'POST',body:JSON.stringify({customer_id:customer.id,amount,due_at:r.due_date,issued_at:r.issued_date||null,external_id:r.invoice_id})});createdInvoices++;if(paid>0){await api('/api/payments',{method:'POST',body:JSON.stringify({invoice_id:invoice.id,amount:paid,paid_at:r.paid_date||new Date().toISOString().slice(0,10),reference:r.payment_reference||`CSV:${r.invoice_id}`})});createdPayments++}}catch(e){failed++;console.warn('Import row failed',r._row,e.message)}bar.style.width=`${Math.round(((i+1)/rows.length)*100)}%`;msg.textContent=`Imported ${i+1}/${rows.length} rows…`}msg.textContent=`Done: ${createdInvoices} invoices, ${createdCustomers} customers, ${createdPayments} payments${failed?`, ${failed} failed`:''}.`;input.value='';await load(true)}catch(e){msg.textContent=e.message||'Import failed.'}finally{btn.disabled=false}}
async function load(keepMessage=false){if(!keepMessage)loading();try{const [o,c,q]=await Promise.all([api('/api/overview'),api('/api/customers'),api('/api/collection/queue')]);render(o,c,q,keepMessage)}catch(e){console.error(e);errorView(e)}}
function render(o,c,q,keepMessage){shell(`<div class="top"><div><div class="brand">CashFlow<b>OS</b></div><div class="sub">Revenue operations · Live workspace</div></div><div class="toolbar"><button class="btn secondary" onclick="load()">Refresh</button><label class="btn" for="csv">Import receivables CSV</label><input id="csv" type="file" accept=".csv,text/csv" hidden onchange="importCsv(this)"></div></div><div class="grid"><div class="card"><div class="label">Outstanding</div><div class="value">${money(o.outstanding)}</div></div><div class="card"><div class="label">Overdue</div><div class="value">${money(o.overdue)}</div></div><div class="card"><div class="label">Promises due today</div><div class="value">${money(o.promisesDueToday)}</div></div><div class="card"><div class="label">Orders waiting</div><div class="value">${o.ordersWaiting||0}</div></div><div class="card"><div class="label">Credit risk</div><div class="value">${o.highRisk||0}</div></div></div><section class="card import"><div class="head"><div><h2>Receivables import</h2><div class="muted">Load customer invoices and payments from a spreadsheet export.</div></div></div><div class="importbox"><input id="importFile" class="file" type="file" accept=".csv,text/csv" onchange="document.getElementById('importBtn').disabled=!this.files.length"><button id="importBtn" class="btn" disabled onclick="importCsv(document.getElementById('importFile'))">Import CSV</button></div><div class="hint">Required: customer_name, invoice_id, due_date, invoice_amount, paid_amount. Optional: issued_date, paid_date, phone, email, credit_limit, payment_reference, customer_id.</div><div class="progress"><span id="importBar"></span></div><div id="importMsg" class="notice">CSV import is ready. Existing customers are matched by name.</div></section><div class="layout"><section class="card"><div class="head"><div><h2>Receivables</h2><div class="muted">Customer exposure and collection risk</div></div><span class="muted">${c.length} customers</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Customer</th><th>Outstanding</th><th>Overdue</th><th>Risk</th></tr></thead><tbody>${c.slice(0,20).map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.phone||x.email||'')}</div></td><td>${money(x.outstanding)}</td><td>${x.max_days_overdue||0} days</td><td><span class="pill ${esc(x.risk)}">${esc(x.risk)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No customers yet.</td></tr>'}</tbody></table></div></section><section class="card"><div class="head"><div><h2>AI collection queue</h2><div class="muted">Prioritized opportunities</div></div></div><div class="queue">${q.slice(0,8).map(x=>`<div class="q"><strong>${esc(x.name)}</strong><p>${money(x.outstanding)} · ${x.max_days_overdue||0} days overdue</p><span class="pill ${esc(x.priority)}">${esc(x.priority)}</span> <button class="btn" onclick="draft(${JSON.stringify(x.name)},${Number(x.outstanding)})">Draft WhatsApp</button></div>`).join('')||'<div class="muted">No collection actions yet.</div>'}</div></section></div><div class="footer">CashFlowOS · Live data from Render API and Neon PostgreSQL</div>`)}
async function draft(name,amount){try{const d=await api('/api/collection/drafts',{method:'POST',body:JSON.stringify({customer_name:name,amount})});alert(d.message)}catch(e){alert(e.message||'Could not generate draft')}}
load();
</script></body></html>
