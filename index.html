<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CashFlowOS — Revenue Operations</title></head>
<body><div id="app"></div><script>
const API='https://cashflowos-api.onrender.com',ORG='00000000-0000-0000-0000-000000000001';
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={},timeout=10000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API+path,{...options,signal:ctl.signal,headers:{'Content-Type':'application/json','x-organization-id':ORG,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`API ${r.status}`);return d}finally{clearTimeout(timer)}}
function shell(body){document.getElementById('app').innerHTML=`<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#111827;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.wrap{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:25px;font-weight:900;letter-spacing:-.04em}.brand b{color:#2563eb}.sub{color:#667085;font-size:13px;margin-top:3px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.btn.secondary{background:white;color:#344054;border:1px solid #d0d5dd}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 1px 2px #00000008}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:800}.value{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:8px}.layout{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:15px;margin:0}.muted{color:#667085}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #eef1f5;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:#667085}.pill{border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;text-transform:capitalize}.high{background:#fff0ee;color:#b42318}.medium{background:#fff7e6;color:#a15c00}.low{background:#ecfdf3;color:#087443}.queue{display:grid;gap:9px}.q{padding:13px;border:1px solid #e6eaf0;border-radius:11px}.q strong{font-size:12px}.q p{font-size:11px;color:#667085;margin:5px 0 8px}.error{margin:30px auto;max-width:650px;background:white;border:1px solid #fecdca;border-radius:14px;padding:22px}.error h2{margin:0 0 8px}.status{font-size:11px;color:#087443;font-weight:800}.skeleton{height:130px;border-radius:14px;background:#eef1f5;margin:20px 0}.footer{margin-top:18px;font-size:11px;color:#98a2b3}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.top{align-items:flex-start}.table{min-width:560px}}
</style><div class="wrap">${body}</div>`}
function loading(){shell(`<div class="top"><div><div class="brand">CashFlow<b>OS</b></div><div class="sub">Revenue operations · Live workspace</div></div></div><div class="skeleton"></div><p class="muted">Connecting to your live workspace…</p>`)}
function errorView(e){const msg=e?.name==='AbortError'?'The API took too long to respond.':(e?.message||'Unable to load the live workspace.');shell(`<div class="top"><div><div class="brand">CashFlow<b>OS</b></div><div class="sub">Revenue operations · Connection status</div></div><button class="btn" onclick="load()">Retry</button></div><div class="error"><div class="status">● LIVE APP</div><h2>We couldn't load your workspace</h2><p class="muted">${esc(msg)}</p><p class="muted">The page is responsive and the API connection will retry when you tap Retry.</p></div>`)}
async function load(){loading();try{const [o,c,q]=await Promise.all([api('/api/overview'),api('/api/customers'),api('/api/collection/queue')]);render(o,c,q)}catch(e){console.error(e);errorView(e)}}
function render(o,c,q){shell(`<div class="top"><div><div class="brand">CashFlow<b>OS</b></div><div class="sub">Revenue operations · Live workspace</div></div><button class="btn secondary" onclick="load()">Refresh</button></div><div class="grid"><div class="card"><div class="label">Outstanding</div><div class="value">${money(o.outstanding)}</div></div><div class="card"><div class="label">Overdue</div><div class="value">${money(o.overdue)}</div></div><div class="card"><div class="label">Promises due today</div><div class="value">${money(o.promisesDueToday)}</div></div><div class="card"><div class="label">Orders waiting</div><div class="value">${o.ordersWaiting||0}</div></div><div class="card"><div class="label">Credit risk</div><div class="value">${o.highRisk||0}</div></div></div><div class="layout"><section class="card"><div class="head"><div><h2>Receivables</h2><div class="muted">Customer exposure and collection risk</div></div><span class="muted">${c.length} customers</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Customer</th><th>Outstanding</th><th>Overdue</th><th>Risk</th></tr></thead><tbody>${c.slice(0,20).map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.phone||x.email||'')}</div></td><td>${money(x.outstanding)}</td><td>${x.max_days_overdue||0} days</td><td><span class="pill ${esc(x.risk)}">${esc(x.risk)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No customers yet.</td></tr>'}</tbody></table></div></section><section class="card"><div class="head"><div><h2>AI collection queue</h2><div class="muted">Prioritized opportunities</div></div></div><div class="queue">${q.slice(0,8).map(x=>`<div class="q"><strong>${esc(x.name)}</strong><p>${money(x.outstanding)} · ${x.max_days_overdue||0} days overdue</p><span class="pill ${esc(x.priority)}">${esc(x.priority)}</span> <button class="btn" onclick="draft(${JSON.stringify(x.name)},${Number(x.outstanding)})">Draft WhatsApp</button></div>`).join('')||'<div class="muted">No collection actions yet.</div>'}</div></section></div><div class="footer">CashFlowOS · Live data from Render API and Neon PostgreSQL</div>`)}
async function draft(name,amount){try{const d=await api('/api/collection/drafts',{method:'POST',body:JSON.stringify({customer_name:name,amount})});alert(d.message)}catch(e){alert(e.message||'Could not generate draft')}}
load();
</script></body></html>
